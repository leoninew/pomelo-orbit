name: CI

on:
  pull_request:
  push:
    branches: [develop, ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked web dependencies
        run: yarn --cwd web install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Go module dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Verify generated sqlc code
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/gen/sqlc

      - name: Set up Task
        uses: go-task/setup-task@v1
        with:
          version: 3.45.4

      - name: Install golangci-lint
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run quality checks
        run: task check

      - name: Run Go vet
        run: go vet ./cmd/... ./internal/... ./sql

      - name: Run tests
        run: |
          yarn --cwd web test
          go test ./cmd/... ./internal/... ./sql

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install locked CLI dependencies
        run: uv --directory scripts sync --locked --no-dev

      - name: Build release packages
        run: uv --directory scripts run --locked --no-sync pomelo-orbit-cli release
