name: Verify Go

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Verify generated sqlc code
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/gen/sqlc

      - name: Verify Go formatting
        run: |
          go fmt ./cmd/... ./internal/... ./sql
          git diff --exit-code -- cmd internal sql

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./cmd/... ./internal/... ./sql

      - name: Run Go vet
        run: go vet ./cmd/... ./internal/... ./sql

      - name: Run Go tests
        run: go test ./cmd/... ./internal/... ./sql
