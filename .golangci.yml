version: "2"

linters:
  exclusions:
    generated: strict
    paths:
      - internal/gen/
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

formatters:
  exclusions:
    generated: strict
    paths:
      - internal/gen/
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
