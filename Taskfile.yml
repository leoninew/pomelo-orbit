version: '3'

# This Taskfile requires a POSIX-compatible shell (Cygwin, Git Bash, or MSYS2)
# for shell scripts and release packaging commands.
vars:
  VERSION:
    sh: cat VERSION
  FIX_ENABLED: '{{if contains "--fix" .CLI_ARGS}}1{{end}}'
  FIX_FORMAT_ARGS: '{{if eq .FIX_ENABLED "1"}}{{else}}--diff{{end}}'
  FIX_LINT_ARGS: '{{if eq .FIX_ENABLED "1"}}--fix{{end}}'
  COVER_ENABLED: '{{if contains "--cov" .CLI_ARGS}}1{{end}}'
  COVER_ARGS: '{{if eq .COVER_ENABLED "1"}}-cover -coverprofile=coverage.out{{end}}'
  WEB_TEST_TASK: '{{if eq .COVER_ENABLED "1"}}test:cov{{else}}test{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Install locked web and script dependencies plus pinned Go tools
    env:
      CGO_ENABLED: '0'
      GOBIN: '{{.TASKFILE_DIR}}/bin'
      PATH: '{{.TASKFILE_DIR}}/bin:{{.PATH}}'
    cmds:
      - yarn --cwd web install --frozen-lockfile
      - uv --directory scripts sync --locked
      - mkdir -p bin
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - go install github.com/bufbuild/buf/cmd/buf@v1.59.0
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - go install github.com/air-verse/air@v1.66.0
      - go mod download

  sqlc:
    desc: Generate sqlc query code
    cmds:
      - ./bin/sqlc generate

  proto:
    desc: Generate Go and TypeScript proto DTOs
    env:
      PATH: '{{.TASKFILE_DIR}}/bin:{{.PATH}}'
    cmds:
      - ./bin/buf dep update
      - ./bin/buf generate
      - ./bin/buf generate . --template web/buf.gen.yaml --output web

  dev:webapi:
    desc: Start the Go development server with hot reload
    env:
      POMELO_ORBIT_APP__ENV: development
    cmds:
      - ./bin/air -c .air.server.toml

  dev:web:
    desc: Start the frontend development server
    cmds:
      - yarn --cwd web dev

  check:
    desc: Check web and Go formatting, lint, and types; use -- --fix to apply fixes
    cmds:
      - yarn --cwd web typecheck
      - yarn --cwd web lint
      - yarn --cwd web format
      - ./bin/golangci-lint config verify
      - ./bin/golangci-lint fmt {{.FIX_FORMAT_ARGS}} ./cmd/... ./internal/... ./sql
      - ./bin/golangci-lint run {{.FIX_LINT_ARGS}} ./cmd/... ./internal/... ./sql

  scripts:check:
    desc: Run Python script format, lint, type, and test checks
    cmds:
      - uv --directory scripts run ruff format --check .
      - uv --directory scripts run ruff check .
      - uv --directory scripts run mypy
      - uv --directory scripts run pytest

  test:
    desc: Run web and Go tests; use -- --cov to collect coverage
    cmds:
      - yarn --cwd web {{.WEB_TEST_TASK}}
      - go test {{.COVER_ARGS}} ./cmd/... ./internal/... ./sql

  build:
    desc: Build the Docker image, optionally with TAG=<tag> and cn=1
    vars:
      TAG: '{{if .TAG}}{{.TAG}}{{else}}latest{{end}}'
      CN: '{{.cn}}'
    cmds:
      - |
        TAG="{{.TAG}}"
        CN="{{.CN}}"
        DOCKERFILE="Dockerfile"

        if [ "$CN" = "1" ]; then
          DOCKERFILE="Dockerfile.cn"
        fi

        docker build -f "$DOCKERFILE" -t "pomelo-orbit:$TAG" .
        printf "image built: pomelo-orbit:%s\n" "$TAG"

  version:
    desc: Print the release version from VERSION
    cmds:
      - uv --directory scripts run version-calc.py

  version:apply:
    desc: Synchronize the release version to tracked metadata
    cmds:
      - uv --directory scripts run version-calc.py --no-dry-run

  install:
    desc: Install or refresh the local agent plugin
    cmds:
      - uv --directory scripts run install.py plugin check
      - uv --directory scripts run install.py plugin apply

  release:
    desc: Build Windows, Linux, and macOS x64 zip packages in dist/ (POSIX shell required)
    env:
      CGO_ENABLED: '0'
    vars:
      WINDOWS_ROOT: 'dist/package/pomelo-orbit-v{{.VERSION}}-windows-x64'
      LINUX_ROOT: 'dist/package/pomelo-orbit-v{{.VERSION}}-linux-x64'
      MACOS_ROOT: 'dist/package/pomelo-orbit-v{{.VERSION}}-macos-x64'
    cmds:
      - rm -rf {{.WINDOWS_ROOT}} {{.LINUX_ROOT}} {{.MACOS_ROOT}} "dist/pomelo-orbit-v{{.VERSION}}-windows-x64.zip" "dist/pomelo-orbit-v{{.VERSION}}-linux-x64.zip" "dist/pomelo-orbit-v{{.VERSION}}-macos-x64.zip"
      - mkdir -p {{.WINDOWS_ROOT}}/static {{.WINDOWS_ROOT}}/configs {{.LINUX_ROOT}}/static {{.LINUX_ROOT}}/configs {{.MACOS_ROOT}}/static {{.MACOS_ROOT}}/configs
      - yarn --cwd web build
      - cmd: go build -trimpath -o {{.WINDOWS_ROOT}}/pomelo-orbit.exe ./cmd/server
        env:
          GOOS: windows
          GOARCH: amd64
      - cmd: go build -trimpath -o {{.LINUX_ROOT}}/pomelo-orbit ./cmd/server
        env:
          GOOS: linux
          GOARCH: amd64
      - cmd: go build -trimpath -o {{.MACOS_ROOT}}/pomelo-orbit ./cmd/server
        env:
          GOOS: darwin
          GOARCH: amd64
      - cp -R web/dist/. {{.WINDOWS_ROOT}}/static/
      - cp -R web/dist/. {{.LINUX_ROOT}}/static/
      - cp -R web/dist/. {{.MACOS_ROOT}}/static/
      - cp configs/config.yaml {{.WINDOWS_ROOT}}/configs/config.yaml
      - cp configs/config.yaml {{.LINUX_ROOT}}/configs/config.yaml
      - cp configs/config.yaml {{.MACOS_ROOT}}/configs/config.yaml
      - cp .env.example VERSION {{.WINDOWS_ROOT}}/
      - cp .env.example VERSION {{.LINUX_ROOT}}/
      - cp .env.example VERSION {{.MACOS_ROOT}}/
      - cp scripts/package/env.release {{.WINDOWS_ROOT}}/.env.release
      - cp scripts/package/env.release {{.LINUX_ROOT}}/.env.release
      - cp scripts/package/env.release {{.MACOS_ROOT}}/.env.release
      - cp scripts/package/pomelo-orbit.cmd {{.WINDOWS_ROOT}}/
      - cp scripts/package/pomelo-orbit.sh {{.WINDOWS_ROOT}}/
      - cp scripts/package/pomelo-orbit.sh {{.LINUX_ROOT}}/
      - cp scripts/package/pomelo-orbit.sh {{.MACOS_ROOT}}/
      - chmod +x {{.WINDOWS_ROOT}}/pomelo-orbit.sh {{.LINUX_ROOT}}/pomelo-orbit {{.MACOS_ROOT}}/pomelo-orbit {{.LINUX_ROOT}}/pomelo-orbit.sh {{.MACOS_ROOT}}/pomelo-orbit.sh
      - cd dist/package && zip -r ../pomelo-orbit-v{{.VERSION}}-windows-x64.zip pomelo-orbit-v{{.VERSION}}-windows-x64
      - cd dist/package && zip -r ../pomelo-orbit-v{{.VERSION}}-linux-x64.zip pomelo-orbit-v{{.VERSION}}-linux-x64
      - cd dist/package && zip -r ../pomelo-orbit-v{{.VERSION}}-macos-x64.zip pomelo-orbit-v{{.VERSION}}-macos-x64

  clean:
    desc: Remove local build artifacts (POSIX shell required)
    cmds:
      - rm -rf bin dist web/dist web/coverage
      - printf "clean complete\n"
