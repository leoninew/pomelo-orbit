version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Install locked web and script dependencies plus pinned Go tools
    env:
      CGO_ENABLED: '0'
      GOBIN: '{{.TASKFILE_DIR}}/bin'
      GOPROXY: direct
      GOTOOLCHAIN: local
      PATH: '{{.TASKFILE_DIR}}/bin{{if eq OS "windows"}};{{else}}:{{end}}{{.PATH}}'
    cmds:
      - yarn --cwd web install --frozen-lockfile
      - uv --directory scripts sync --locked
      - mkdir -p bin
      - |
        set -e
        tool_ext="$(go env GOEXE)"
        install_tool() {
          tool="$1"
          package="$2"
          version="$3"
          binary="$GOBIN/$tool$tool_ext"
          installed_version=""
          if [ -f "$binary" ] && { [ "$tool_ext" = .exe ] || [ -x "$binary" ]; }; then
            installed_version="$(go version -m "$binary" 2>/dev/null |
              while read -r field module module_version checksum; do
                if [ "$field" = mod ]; then
                  printf '%s' "$module_version"
                  break
                fi
              done)"
          fi
          if [ "$installed_version" = "$version" ]; then
            printf "%s %s is ready; skipping install\n" "$tool" "$version"
          else
            go install "$package@$version"
          fi
        }
        install_tool sqlc github.com/sqlc-dev/sqlc/cmd/sqlc v1.30.0
        install_tool buf github.com/bufbuild/buf/cmd/buf v1.59.0
        install_tool protoc-gen-go google.golang.org/protobuf/cmd/protoc-gen-go v1.36.11
        install_tool golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint v2.12.2
        install_tool air github.com/air-verse/air v1.66.0
      - go mod download

  sqlc:
    desc: Generate sqlc query code
    cmds:
      - ./bin/sqlc generate

  proto:
    desc: Generate Go and TypeScript proto DTOs
    env:
      PATH: '{{.TASKFILE_DIR}}/bin:{{.PATH}}'
    cmds:
      - ./bin/buf dep update
      - ./bin/buf generate
      - ./bin/buf generate . --template web/buf.gen.yaml --output web

  webapi:dev:
    desc: Start the Go development server with hot reload
    env:
      POMELO_ORBIT_APP__ENV: development
    cmds:
      - ./bin/air -c .air.server.toml

  web:dev:
    desc: Start the frontend development server
    cmds:
      - yarn --cwd web dev

  check:
    desc: Check web and Go formatting, lint, and types; use -- --fix to apply fixes
    vars:
      FIX_ENABLED: '{{if contains "--fix" (default "" .CLI_ARGS)}}1{{end}}'
      FIX_FORMAT_ARGS: '{{if eq .FIX_ENABLED "1"}}{{else}}--diff{{end}}'
      FIX_LINT_ARGS: '{{if eq .FIX_ENABLED "1"}}--fix{{end}}'
      WEB_LINT_TASK: '{{if eq .FIX_ENABLED "1"}}lint:fix{{else}}lint{{end}}'
      WEB_FORMAT_TASK: '{{if eq .FIX_ENABLED "1"}}format:fix{{else}}format{{end}}'
    cmds:
      - yarn --cwd web typecheck
      - yarn --cwd web {{.WEB_LINT_TASK}}
      - yarn --cwd web {{.WEB_FORMAT_TASK}}
      - ./bin/golangci-lint config verify
      - ./bin/golangci-lint fmt {{.FIX_FORMAT_ARGS}} ./cmd/... ./internal/... ./sql
      - ./bin/golangci-lint run {{.FIX_LINT_ARGS}} ./cmd/... ./internal/... ./sql

  test:
    desc: Run web and Go tests; use -- --cov to collect coverage
    vars:
      COVER_ENABLED: '{{if contains "--cov" (default "" .CLI_ARGS)}}1{{end}}'
      COVER_ARGS: '{{if eq .COVER_ENABLED "1"}}-cover -coverprofile=coverage.out{{end}}'
      WEB_TEST_TASK: '{{if eq .COVER_ENABLED "1"}}test:cov{{else}}test{{end}}'
    cmds:
      - yarn --cwd web {{.WEB_TEST_TASK}}
      - go test {{.COVER_ARGS}} ./cmd/... ./internal/... ./sql

  build:
    desc: Build the Docker image, optionally with TAG=<tag> and cn=1
    vars:
      TAG: '{{if .TAG}}{{.TAG}}{{else}}latest{{end}}'
      CN: '{{.cn}}'
    cmds:
      - |
        TAG="{{.TAG}}"
        CN="{{.CN}}"
        DOCKERFILE="Dockerfile"

        if [ "$CN" = "1" ]; then
          DOCKERFILE="Dockerfile.cn"
        fi

        docker build -f "$DOCKERFILE" -t "pomelo-orbit:$TAG" .
        printf "image built: pomelo-orbit:%s\n" "$TAG"

  install:
    desc: Install or refresh the local agent plugin
    cmds:
      - uv --directory scripts run install.py plugin check
      - uv --directory scripts run install.py plugin apply
