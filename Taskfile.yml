version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install web and Go dependencies
    cmds:
      - bash -c 'cd web && yarn install'
      - go mod download
      - go mod tidy

  run:
    desc: Start the development orchestrator
    cmds:
      - bash -c 'uv run python scripts/run.py'

  check:
    desc: Run web and Go checks
    cmds:
      - bash -c 'cd web && yarn lint:fix'
      - bash -c 'cd web && yarn format'
      - bash -c 'cd web && yarn typecheck'
      - go fmt ./cmd/... ./internal/...
      - go vet ./cmd/... ./internal/...
      - go test ./cmd/... ./internal/...

  test:
    desc: Run web and Go tests
    cmds:
      - bash -c 'cd web && yarn test'
      - go test ./cmd/... ./internal/...

  build:
    desc: Build the Docker image, optionally with TAG=<tag> and CN=1
    vars:
      TAG: '{{if .TAG}}{{.TAG}}{{else}}latest{{end}}'
      CN: '{{.CN}}'
    cmds:
      - |
        bash -c '
          TAG="{{.TAG}}"
          CN="{{.CN}}"
          DOCKERFILE="Dockerfile"

          if [[ "$CN" == "1" ]]; then
            DOCKERFILE="Dockerfile.cn"
          fi

          docker build -f "$DOCKERFILE" -t "pomelo-orbit:$TAG" .
          printf "image built: pomelo-orbit:%s\n" "$TAG"
        '

  clean:
    desc: Remove local build artifacts
    cmds:
      - bash -c 'rm -rf bin web/dist web/coverage'
      - bash -c 'echo "clean complete"'
