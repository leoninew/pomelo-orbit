app:
  name: Pomelo Orbit Backend Go
  version: 0.1.0
  debug: false

server:
  host: localhost
  port: 8080

logging:
  level: info
  file: logs/backend-go.log
  max_size_mb: 100
  max_backups: 7

database:
  driver: sqlite
  sqlite:
    path: data/db/pomelo-orbit.db
  mysql:
    dsn: ""

orbit:
  root: .

jwt:
  secret_key: ""

traefik:
  domain_suffix: lvh.me
  dynamic_route_dir: data/cd/traefik/data/dynamic
  cert_dir: data/cd/traefik/data/certs
  container_name: traefik

turnstile:
  enabled: true
  site_key: "1x00000000000000000000AA"
  secret_key: "1x0000000000000000000000000000000AA"
  verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"

cert:
  letsencrypt:
    enabled: false
    email: ""
    challenge: http
    dns_provider: ""

worker:
  id: default
  poll_interval: 1s
  lease_duration: 5m
  max_attempts: 3
  concurrency: 2
