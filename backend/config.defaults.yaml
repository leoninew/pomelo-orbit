# Pomelo Orbit 默认配置
# 配置优先级：环境变量 > config.yaml > config.defaults.yaml

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname).5s] %(name)s:%(lineno)d %(message)s"
  api_prefix: "/api"

app:
  name: "Pomelo Orbit"
  version: "0.1.0"
  debug: false

cors:
  origins:
    - "http://localhost:10002"
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

database:
  type: "sqlite"
  sqlite:
    path: "data/db/pomelo-orbit.db"
  echo: false

# JWT 认证（同时用于凭据加密，密钥必须为 Fernet 格式）
jwt:
  secret_key: ""                     # 从环境变量 POMELO_ORBIT_JWT__SECRET_KEY 读取，必须是 Fernet 格式
  algorithm: "HS256"
  expire_minutes: 10080              # 7 天

# Webhook 配置
webhook:
  secret: ""                         # GitHub Webhook Secret，留空则跳过签名验证
  max_payload_size: 10485760         # 10MB，最大 payload 大小

# CI 配置
ci:
  # 全局变量：注入所有 pipeline run
  # 示例：
  # global_variables:
  #   PROJECT_NAME: "Pomelo Orbit"
  #   PROJECT_VERSION: "0.1.0"
  #   ENVIRONMENT: "production"
  global_variables:
    PROJECT_NAME: "Pomelo Orbit"
    PROJECT_VERSION: "0.1.0"
  


# 数据清理
cleanup:
  deploy_record_retention_days: 30
  max_deploy_record_size: 1048576       # 1MB
  max_payload_size: 102400           # 100KB

# Traefik 配置
traefik:
  api_url: "http://traefik:8080"           # Traefik API 地址（内部访问）
  domain_suffix: "lvh.me"                    # 应用域名后缀，拼接时加 . 分隔，如 traefik.lvh.me
  dynamic_route_dir: "data/cd/traefik/data/dynamic"  # 相对于项目根目录
  cert_dir: "data/cd/traefik/data/certs"             # 相对于项目根目录
  container_name: "traefik"                  # Traefik 容器名称

# 证书配置（影响 Traefik 配置文件生成）
cert:
  # Let's Encrypt 自动证书
  # 启用后，Traefik 会根据 docker label 中的 tls.certresolver=letsencrypt 自动申请证书
  # 适用场景：公网域名，需要受信任的证书
  letsencrypt:
    enabled: false                             # 是否启用 Let's Encrypt
    email: ""                                  # 邮箱（用于证书到期提醒，必填）
    challenge: "http"                          # 验证方式：http | dns
    dns_provider: ""                           # DNS 提供商（challenge=dns 时必填）：cloudflare | aliyun | route53
    # DNS API 凭据通过环境变量配置，例如：
    # Cloudflare: CLOUDFLARE_API_TOKEN=xxx
    # 阿里云: ALIYUN_ACCESS_KEY=xxx, ALIYUN_SECRET_KEY=xxx
    # Route53: AWS_ACCESS_KEY_ID=xxx, AWS_SECRET_ACCESS_KEY=xxx

  # 静态证书（mkcert 和手动上传）
  # 证书文件存放在 data/cd/traefik/data/certs 目录
  # 动态配置由应用层生成（data/cd/traefik/data/dynamic/certificates.yml）
  # 适用场景：本地开发（mkcert）、内网域名（手动上传）
