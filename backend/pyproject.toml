[project]
name = "pomelo-orbit"
version = "0.1.0"
description = "Pomelo Orbit Backend"
requires-python = ">=3.12"
dependencies = [
    "dynaconf>=3.2.0",
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.46",
    "sqlparse>=0.4.4",
    "uvicorn[standard]>=0.40.0",
    # JWT 认证
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Google OAuth
    "google-auth>=2.0.0",
    # 凭据加密
    "cryptography>=42.0.0",
    # Docker 操作
    "docker>=7.0.0",
    # 异步支持
    "aiofiles>=23.0.0",
    # Gateway 配置
    "pyyaml>=6.0.0",
    # 模板引擎
    "jinja2>=3.1.0",
    # ULID 支持
    "python-ulid>=2.0.0",
    "httpx>=0.27.0",
    "dishka>=1.9.1",
    # 验证码生成
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomelo_orbit"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pytest>=9.0.2",
]

# Ruff、Mypy、Pytest 配置已移至独立文件：
# - ruff.toml: Ruff linter 和 formatter 配置
# - mypy.ini: Mypy 类型检查配置
# - pytest.ini: Pytest 测试配置
