# Pytest 配置文件
# https://docs.pytest.org/en/stable/reference/customize.html

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-5s] %(filename)s:%(lineno)d %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO

# 编码配置（解决 Windows 下的编码问题）
pythonpath = src

# 测试环境变量
env =
    POMELO_ORBIT_DATABASE__TYPE=sqlite
    POMELO_ORBIT_DATABASE__SQLITE__PATH=:memory:
    POMELO_ORBIT_JWT__SECRET_KEY=mNGu9ayJZ54VVgsuJzcU7gJLXwHnWRjnfbg8ISzvqkQ=
    POMELO_ORBIT_TRAEFIK__DYNAMIC_CONFIG_DIR=/tmp/test-traefik