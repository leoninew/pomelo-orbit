# Ruff 配置文件
# https://docs.astral.sh/ruff/

line-length = 120
target-version = "py312"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade (自动升级到新语法)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "TC",     # flake8-type-checking (优化类型导入)
    "FA",     # flake8-future-annotations (强制使用 PEP 563)
    "PIE",    # flake8-pie (misc lints)
    "T20",    # flake8-print (禁止 print)
    "RET",    # flake8-return (简化 return 语句)
    "PTH",    # flake8-use-pathlib (使用 pathlib)
    "PYI",    # flake8-pyi (类型存根最佳实践)
    "PERF",   # Perflint (性能优化)
    "PLC0415", # import-outside-toplevel (禁止函数内部 import)
]

ignore = [
    "E501",   # line too long (由 formatter 处理)
    "B008",   # function call in argument defaults
    "B904",   # raise without from inside except
    "T201",   # print found (某些场景需要)
    "RUF002", # docstring contains ambiguous unicode character
    "RUF003", # comment contains ambiguous unicode character
    "TC003", # Move standard library import into TYPE_CHECKING block (false positives for runtime usage)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["T201", "PLC0415"]  # 测试中允许 print 和函数内 import（避免循环依赖）

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "*.egg-info",
    "build",
    "dist",
]
