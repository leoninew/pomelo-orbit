app:
  name: Pomelo Orbit Backend Go
  version: 0.271.0
  debug: false

server:
  host: 127.0.0.1
  port: 9021
  cors_allowed_origins: []
  api_path_prefixes:
    - /api
  public_url: ""

logging:
  level: info
  file: logs/pomelo-orbit.log
  deployment_root: data/deployment-logs
  max_size_mb: 100
  max_backups: 7
  http:
    enabled: false
    request_body_limit: 4096
    response_body_limit: 4096
    skip_asset_enabled: true

database:
  driver: sqlite
  sqlite:
    path: data/db/pomelo-orbit.db
  mysql:
    dsn: ""
  postgres:
    dsn: ""

workspace:
  pipeline: data/pipeline

orbit:
  root: .

jwt:
  # Set through .env.release or POMELO_ORBIT_JWT__SECRET_KEY at runtime.
  # Generate with: python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  secret_key: ""

project_initialization:
  environment:
    local_workspace_root: ~/.pomelo-orbit
  gateway:
    image: traefik:3.6
    rest_api_url: http://localhost:8080
    base_domain: lvh.me
    rest_ready_timeout: 20s
    default_entrypoint: web
    tls_mode: none
    acme_profile: ""
    acme_email: ""
    dns_api_token: ""

turnstile:
  enabled: true
  site_key: "1x00000000000000000000AA"
  secret_key: "1x0000000000000000000000000000000AA"
  verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"

settings:
  secret_keys:
    - database__mysql__dsn
    - database__postgres__dsn
    - jwt__secret_key
    - turnstile__secret_key
    - llm__api_key
    - project_initialization__gateway__dns_api_token

llm:
  base_url: ""
  api_key: ""
  model: ""
  timeout: 60s
  max_tool_call_rounds: 64

# Local Codex stdio MCP PAT. Set POMELO_ORBIT_MCP__ACCESS_TOKEN only in the
# parent process environment; do not store a real token in this file.
mcp:
  access_token: ""

pipeline_run:
  execution_timeout: 1h

worker:
  id: default
  poll_interval: 1s
  lease_duration: 1h5m
  max_attempts: 1
  concurrency: 2
