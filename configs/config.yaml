app:
  name: Pomelo Orbit Backend Go
  version: 0.261.3
  debug: false

server:
  host: 127.0.0.1
  port: 9021
  cors_allowed_origins: []
  api_path_prefixes:
    - /api
  public_url: ""

logging:
  level: info
  file: logs/pomelo-orbit.log
  max_size_mb: 100
  max_backups: 7
  http:
    enabled: false
    request_body_limit: 4096
    response_body_limit: 4096
    skip_asset_enabled: true

database:
  driver: sqlite
  sqlite:
    path: data/db/pomelo-orbit.db
  mysql:
    dsn: ""

workspace:
  pipeline: data/pipeline
  deployment: data/deployment

orbit:
  root: .

jwt:
  # Set through .env.release or POMELO_ORBIT_JWT__SECRET_KEY at runtime.
  # Generate with: python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  secret_key: ""

traefik:
  # Infrastructure only. Product identity (code/component/network) is fixed in code.
  image: traefik:3.6
  rest_api_url: http://localhost:8080
  base_domain: lvh.me
  rest_ready_timeout: 20s

turnstile:
  enabled: true
  site_key: "1x00000000000000000000AA"
  secret_key: "1x0000000000000000000000000000000AA"
  verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"

cert:
  letsencrypt:
    enabled: false
    email: ""
    challenge: http
    dns_provider: ""

settings:
  secret_keys:
    - database__mysql__dsn
    - jwt__secret_key
    - turnstile__secret_key
    - llm__api_key

llm:
  base_url: ""
  api_key: ""
  model: ""
  timeout: 60s
  max_tool_call_rounds: 64

# Local Codex MCP browser authorization. Production deployments should set
# mcp.web_url to the externally reachable Orbit UI origin.
mcp:
  api_url: "http://127.0.0.1:9021"
  web_url: "http://localhost:9020"
  auth_timeout: 3m

pipeline_run:
  execution_timeout: 1h

worker:
  id: default
  poll_interval: 1s
  lease_duration: 1h5m
  max_attempts: 1
  concurrency: 2
