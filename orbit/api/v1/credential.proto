syntax = "proto3";

package orbit.api.v1;

option go_package = "backend/internal/transport/http/dto/proto/orbit/api/v1;apiv1";

message CredentialResp {
  string id = 1;
  string name = 2;
  string type = 3;
  string created_at = 4;
}

message CredentialDetailResp {
  string id = 1;
  string name = 2;
  string type = 3;
  string data = 4;
  string created_at = 5;
}

message CredentialCreateReq {
  string name = 1;
  string type = 2;
  string data = 3;
}

message CredentialUpdateReq {
  optional string name = 1;
  optional string data = 2;
}

message CredentialExportResp {
  string version = 1;
  string name = 2;
  string type = 3;
  string data = 4;
}

message CredentialImportReq {
  string version = 1;
  string name = 2;
  string type = 3;
  string data = 4;
}

message CredentialPaginatedResp {
  repeated CredentialResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
