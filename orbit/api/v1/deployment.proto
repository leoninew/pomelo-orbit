syntax = "proto3";

package orbit.api.v1;

option go_package = "backend/internal/transport/http/dto/proto/orbit/api/v1;apiv1";

message DeploymentLogsResp {
  string logs = 1;
  int32 offset = 2;
  bool is_complete = 3;
  string status = 4;
}

message DeploymentContainerLogsResp {
  string logs = 1;
  string source = 2;
  bool is_realtime_supported = 3;
}

message DeploymentResp {
  string id = 1;
  optional string project_id = 2;
  optional string application_id = 3;
  string application_name = 4;
  string operation_type = 5;
  string trigger_type = 6;
  string command_text = 7;
  string status = 8;
  string started_at = 9;
  optional string finished_at = 10;
  optional int32 duration_ms = 11;
  optional string log_text = 12;
  optional string error_message = 13;
  bool is_rollback = 14;
  optional string rollback_from_deployment_id = 15;
  string created_at = 16;
}

message DeploymentPaginatedResp {
  repeated DeploymentResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
