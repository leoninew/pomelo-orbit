syntax = "proto3";

package orbit.api.v1;

option go_package = "backend/internal/gen/orbit/api/v1;apiv1";

message LoginHistoryResp {
  string id = 1;
  string user_id = 2;
  string username = 3;
  optional string ip_address = 4;
  optional string user_agent = 5;
  string login_at = 6;
  bool success = 7;
}

message LoginHistoryPaginatedResp {
  repeated LoginHistoryResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}

message TokenResp {
  string access_token = 1;
  string token_type = 2;
}

message UserInfoResp {
  string id = 1;
  string username = 2;
  optional string email = 3;
  string auth_source = 4;
  string created_at = 5;
  optional string last_login_at = 6;
  repeated string roles = 7;
  repeated string permissions = 8;
}

message CSRFTokenResp {
  string token = 1;
}

message LoginReq {
  string username = 1;
  string password = 2;
  string csrf_token = 3;
  string turnstile_token = 4;
}

message LogoutReq {}

message PasswordChangeReq {
  string old_password = 1;
  string new_password = 2;
}

message GoogleCallbackReq {
  string code = 1;
}

message TurnstileConfigResp {
  bool enabled = 1;
  string site_key = 2;
}
