syntax = "proto3";

package orbit.api.v1;

option go_package = "backend/internal/gen/orbit/api/v1;apiv1";

message UserRoleResp {
  string id = 1;
  string code = 2;
  string name = 3;
  repeated string permission_codes = 4;
}

message UserListResp {
  string id = 1;
  string username = 2;
  optional string email = 3;
  string auth_source = 4;
  string created_at = 5;
  optional string last_login_at = 6;
  string status = 7;
  string updated_at = 8;
  repeated UserRoleResp role_items = 9;
}

message UserResp {
  string id = 1;
  string username = 2;
  optional string email = 3;
  string auth_source = 4;
  string created_at = 5;
  optional string last_login_at = 6;
  repeated string roles = 7;
  repeated string permissions = 8;
  string status = 9;
  string updated_at = 10;
  repeated UserRoleResp role_items = 11;
}

message UserCreateReq {
  string username = 1;
  string password = 2;
  optional string email = 3;
}

message UserUpdateReq {
  optional string username = 1;
  optional string password = 2;
  optional string status = 3;
}

message UserRoleUpdateReq {
  repeated string role_ids = 1;
}

message UserDisableReq {}

message UserEnableReq {}

message UserPaginatedResp {
  repeated UserListResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
