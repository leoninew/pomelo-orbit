syntax = "proto3";

package orbit.api.v1;

option go_package = "backend/internal/gen/orbit/api/v1;apiv1";

message RepositoryWebhookResp {
  string id = 1;
  string repository_id = 2;
  string name = 3;
  string template_id = 4;
  optional string branch_filter = 5;
  string secret = 6;
  bool enabled = 7;
  string created_at = 8;
  string updated_at = 9;
}

message RepositoryWebhookListResp {
  repeated RepositoryWebhookResp items = 1;
}

message RepositoryWebhookReceiveResp {
  string status = 1;
  string reason = 2;
  string run_id = 3;
}

message RepositoryWebhookCreateReq {
  string name = 1;
  string template_id = 2;
  string secret = 3;
  optional string branch_filter = 4;
}

message RepositoryWebhookUpdateReq {
  optional string name = 1;
  optional string template_id = 2;
  optional string secret = 3;
  optional string branch_filter = 4;
  optional bool enabled = 5;
}
