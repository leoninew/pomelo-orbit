syntax = "proto3";

package orbit.v1.application;

message ApplicationResp {
  string id = 1;
  optional string project_id = 2;
  string name = 3;
  string code = 4;
  string image_pull_policy = 5;
  string created_at = 7;
  string updated_at = 8;
  // kind is standard|gateway; immutable after create.
  string kind = 12;
}

message ApplicationCreateReq {
  string name = 1;
  string code = 2;
  string image_pull_policy = 3;
  // optional; empty defaults to standard.
  optional string kind = 4;
}

message ApplicationUpdateReq {
  optional string name = 1;
  optional string code = 2;
  optional string image_pull_policy = 3;
}

message ApplicationDeployReq {
  string version_id = 1;
  string instance_key = 2;
  bool force_recreate = 3;
}

message ApplicationStopReq {
  bool remove_volumes = 1;
  string service_id = 3;
}

message ApplicationRestartReq {
  string service_id = 2;
}

message DeploymentActionResp {
  string deployment_id = 1;
}

message ApplicationContainerStatusResp {
  string id = 1;
  string name = 2;
  string service = 3;
  string state = 4;
  string status = 5;
  string health = 6;
  string image = 7;
  string version_id = 8;
  string version_label = 9;
  string component_id = 10;
}

message ApplicationStatusResp {
  repeated ApplicationContainerStatusResp containers = 1;
}

message ApplicationLogsResp {
  string logs = 1;
}

message ApplicationPaginatedResp {
  repeated ApplicationResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
