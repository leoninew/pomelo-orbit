syntax = "proto3";

package orbit.v1.application;

message VersionComponentReq {
  string name = 1;
  string image = 2;
  repeated string command = 3;
  repeated string args = 4;
  repeated ComponentEnv env = 5;
  repeated ComponentPort ports = 6;
  repeated ComponentMount mounts = 7;
  repeated string networks = 8;
  repeated ComponentDependency dependencies = 9;
  ComponentHealthcheck healthcheck = 10;
  ComponentResources resources = 11;
  optional string pull_policy = 12;
  optional string restart_policy = 13;
  repeated ComponentTmpfs tmpfs = 14;
  repeated ComponentUlimit ulimits = 15;
}

message VersionComponentResp {
  string id = 1;
  string version_id = 2;
  string name = 3;
  string image = 4;
  repeated string command = 5;
  repeated string args = 6;
  repeated ComponentEnv env = 7;
  repeated ComponentPort ports = 8;
  repeated ComponentMount mounts = 9;
  repeated string networks = 10;
  repeated ComponentDependency dependencies = 11;
  ComponentHealthcheck healthcheck = 12;
  ComponentResources resources = 13;
  optional string pull_policy = 14;
  string created_at = 15;
  string updated_at = 16;
  optional string restart_policy = 17;
  repeated ComponentTmpfs tmpfs = 18;
  repeated ComponentUlimit ulimits = 19;
}

message ComponentEnv {
  string key = 1;
  string value = 2;
}

message ComponentPort {
  int32 host_port = 1;
  int32 container_port = 2;
}

message ComponentMount {
  string source_type = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
  optional string content = 5;
  optional string content_mode = 6;
}

message ComponentDependency {
  string name = 1;
  string condition = 2;
}

message ComponentHealthcheck {
  string test_mode = 1;
  repeated string test = 2;
  optional string interval = 3;
  optional string timeout = 4;
  optional int32 retries = 5;
  optional string start_period = 6;
  optional string start_interval = 7;
  bool disabled = 8;
}

message ComponentResources {
  optional string limit_cpus = 1;
  optional string limit_memory = 2;
  optional string reservation_cpus = 3;
  optional string reservation_memory = 4;
}

message ComponentTmpfs {
  string target = 1;
  int64 size_bytes = 2;
  string mode = 3;
}

message ComponentUlimit {
  string name = 1;
  int64 soft = 2;
  int64 hard = 3;
}

message VersionExposeReq {
  string component_name = 1;
  string protocol = 2;
  int32 container_port = 3;
  optional string path_prefix = 4;
  // local | public; empty treated as public
  string access = 5;
  // 0/omit = use container_port
  optional int32 listen_port = 6;
}

message VersionExposeResp {
  string id = 1;
  string version_id = 2;
  string component_name = 3;
  string protocol = 4;
  int32 container_port = 5;
  optional string path_prefix = 6;
  string created_at = 7;
  string updated_at = 8;
  string access = 9;
  optional int32 listen_port = 10;
}

message VersionCreateReq {
  string application_id = 1;
  string label = 2;
  optional string env_json = 3;
  optional string note = 4;
  repeated VersionComponentReq components = 5;
  repeated VersionExposeReq exposes = 6;
}

message VersionUpdateReq {
  optional string label = 1;
  optional string env_json = 2;
  optional string note = 3;
  reserved 4;
  repeated VersionExposeReq exposes = 5;
}

message VersionForkReq {
  string label = 1;
}

message VersionResp {
  string id = 1;
  string application_id = 2;
  string label = 3;
  string status = 4;
  optional string env_json = 5;
  optional string created_from_version_id = 6;
  optional string note = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated VersionComponentResp components = 10;
  repeated VersionExposeResp exposes = 11;
  string component_summary = 12;
}

message VersionPaginatedResp {
  repeated VersionResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}

message VersionPreviewReq {
  optional string instance_key = 1;
}

message VersionPreviewResp {
  string compose_yaml = 1;
}
