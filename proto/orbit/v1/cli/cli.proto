syntax = "proto3";

package orbit.v1.cli;

message ProjectResp {
  string id = 1;
  string name = 2;
  string code = 3;
  bool is_active = 4;
  string environment_id = 5;
  string target_type = 6;
  string platform = 7;
  string host = 8;
  int32 port = 9;
  string username = 10;
}

message ProjectListResp {
  repeated ProjectResp projects = 1;
}

message ExecReq {
  string project_code = 1;
  repeated string argv = 2;
  string workdir = 3;
  bytes stdin = 4;
  optional uint32 timeout_seconds = 5;
}

message ExecResp {
  string project_id = 1;
  string project_code = 2;
  string environment_id = 3;
  int64 target_revision = 4;
  string state = 5;
  optional int32 exit_code = 6;
  bytes stdout = 7;
  bytes stderr = 8;
  int64 duration_ms = 9;
  bool output_truncated = 10;
}
