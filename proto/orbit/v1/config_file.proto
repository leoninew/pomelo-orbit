syntax = "proto3";

package orbit.v1;


message ConfigFileReq {
  string path = 1;
  string content = 2;
}

message ApplicationExportConfigFileResp {
  string path = 1;
  string content = 2;
}

message ApplicationFileContentResp {
  string content = 1;
  string path = 2;
}

message ConfigFileResp {
  string id = 1;
  string path = 2;
  string created_at = 3;
}

message ConfigFileListResp {
  repeated ConfigFileResp items = 1;
}
