syntax = "proto3";

package orbit.v1.gateway;

message GatewayVersionBinding {
  string profile = 1;
  string version_id = 2;
}

message GatewayCreateReq {
  string project_id = 1;
  string code = 2;
  string name = 3;
  string rest_api_url = 4;
  string base_domain = 5;
  optional string initial_component_image = 6;
  string initial_component_pull_policy = 7;
  // Traefik entryPoints name: web|websecure (default web when empty on create)
  optional string default_entrypoint = 8;
  // none|letsencrypt|tls (default none when empty on create)
  optional string tls_mode = 9;
  reserved 10;
  reserved "traefik_component_name";
  optional int32 rest_ready_timeout_seconds = 11;
  optional string acme_profile = 12;
  optional string acme_email = 13;
  optional string dns_api_token = 14;
}

message GatewayUpdateReq {
  optional string name = 1;
  optional string rest_api_url = 2;
  optional string base_domain = 3;
  optional string default_entrypoint = 4;
  optional string tls_mode = 5;
  reserved 6;
  reserved "traefik_component_name";
  optional int32 rest_ready_timeout_seconds = 7;
  optional string acme_profile = 8;
  optional string acme_email = 9;
  optional string dns_api_token = 10;
}

// Read-only active exit / cluster DNS row (not a CRUD resource).
message GatewayExposureItem {
  string application_id = 1;
  string application_code = 2;
  string component_name = 3;
  string protocol = 4;
  string access = 5;
  int32 container_port = 6;
  int32 listen_port = 7;
  string public_host = 8;
  string internal_dns = 9;
  string client_hint = 10;
}

message GatewayResp {
  string id = 1;
  string project_id = 2;
  string code = 3;
  string name = 4;
  string kind = 5;
  string rest_api_url = 6;
  string base_domain = 7;
  string created_at = 8;
  string updated_at = 9;
  string config_updated_at = 10;
  string default_entrypoint = 11;
  string tls_mode = 12;
  repeated GatewayExposureItem exposures = 13;
  string default_service_id = 14;
  string default_service_instance_key = 15;
  string default_service_code = 16;
  string default_service_status = 17;
  reserved 18;
  reserved "traefik_component_name";
  int32 rest_ready_timeout_seconds = 19;
  string acme_profile = 20;
  string acme_email = 21;
  string dns_api_token = 22;
  repeated GatewayVersionBinding version_bindings = 23;
}

message GatewayPaginatedResp {
  repeated GatewayResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
