syntax = "proto3";

package orbit.v1.pipeline;


message ArtifactConfigResp {
  string collector = 1;
  string reference = 2;
  string name = 3;
  string command = 4;
  string format = 5;
}

message ArtifactConfigReq {
  string collector = 1;
  string reference = 2;
  string name = 3;
  string command = 4;
  string format = 5;
}

message ArtifactConfigListReq {
  repeated ArtifactConfigReq items = 1;
}

message BuildVersionBindingReq {
  string application_id = 1;
  string component_name = 2;
  string fork_strategy = 3;
  optional string fixed_version_id = 4;
}

message BuildVersionBindingResp {
  string application_id = 1;
  string component_name = 2;
  string fork_strategy = 3;
  optional string fixed_version_id = 4;
  string application_name = 5;
}

message PipelineStageResp {
  string id = 1;
  string name = 2;
  string image = 3;
  string script = 4;
  repeated ArtifactConfigResp artifacts = 5;
  string description = 6;
  int32 version = 7;
  string created_at = 8;
  string updated_at = 9;
  optional BuildVersionBindingResp build_version_binding = 10;
}

message PipelineStageCreateReq {
  string name = 1;
  string image = 2;
  string script = 3;
  repeated ArtifactConfigReq artifacts = 4;
  string description = 5;
  optional BuildVersionBindingReq build_version_binding = 6;
}

message PipelineStageUpdateReq {
  optional string name = 1;
  optional string image = 2;
  optional string script = 3;
  optional ArtifactConfigListReq artifacts = 4;
  optional string description = 5;
  optional BuildVersionBindingReq build_version_binding = 6;
  optional bool clear_build_version_binding = 7;
}

message PipelineStageDuplicateReq {}

message PipelineStagePaginatedResp {
  repeated PipelineStageResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
