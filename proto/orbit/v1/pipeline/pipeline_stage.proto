syntax = "proto3";

package orbit.v1.pipeline;

message ArtifactConfigResp {
  string collector = 1;
  string reference = 2;
  string name = 3;
  string command = 4;
  string format = 5;
  optional string component_name = 6;
}

message ArtifactConfigReq {
  string collector = 1;
  string reference = 2;
  string name = 3;
  string command = 4;
  string format = 5;
  optional string component_name = 6;
}

message ArtifactConfigListReq { repeated ArtifactConfigReq items = 1; }

message PipelineStageResp {
  string id = 1;
  string pipeline_id = 2;
  string name = 3;
  string image = 4;
  string script = 5;
  repeated ArtifactConfigResp artifacts = 6;
  repeated string depends_on = 7;
  int32 sort_order = 8;
  string description = 9;
  string created_at = 10;
  string updated_at = 11;
}

message PipelineStageCreateReq {
  string name = 1;
  string image = 2;
  string script = 3;
  repeated ArtifactConfigReq artifacts = 4;
  repeated string depends_on = 5;
  int32 sort_order = 6;
  string description = 7;
  // These fields update the owning application Pipeline in the same
  // transaction as its initial component-mapped artifact declarations.
  optional string version_fork_strategy = 8;
  optional string fixed_version_id = 9;
}

message PipelineStageUpdateReq {
  optional string name = 1;
  optional string image = 2;
  optional string script = 3;
  optional ArtifactConfigListReq artifacts = 4;
  optional StringListReq depends_on = 5;
  optional int32 sort_order = 6;
  optional string description = 7;
  // These fields update the owning application Pipeline in the same
  // transaction as its component-mapped artifact declarations.
  optional string version_fork_strategy = 8;
  optional string fixed_version_id = 9;
  optional bool clear_version_fork_strategy = 10;
}

message StringListReq { repeated string items = 1; }
