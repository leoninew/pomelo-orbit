syntax = "proto3";

package orbit.v1.pipeline;


import "orbit/v1/pipeline/pipeline_stage.proto";
import "orbit/v1/common/common.proto";

message PipelineSnapshotResp {
  string id = 1;
  string template_id = 2;
  string template_name = 3;
  int32 template_version = 4;
  int32 version = 5;
  repeated SnapshotStageResp stages_snapshot = 6;
  repeated orbit.v1.common.VariableDeclarationResp variables_snapshot = 7;
  string created_at = 8;
}

message SnapshotStageResp {
  string name = 1;
  string id = 2;
  string image = 3;
  int32 version = 4;
  repeated string depends_on = 5;
  string script = 6;
  repeated ArtifactConfigResp artifacts = 7;
  optional BuildVersionBindingResp build_version_binding = 8;
}
