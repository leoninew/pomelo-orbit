syntax = "proto3";

package orbit.v1.pipeline_run;

import "orbit/v1/common/common.proto";
import "orbit/v1/pipeline_run/artifact.proto";
import "orbit/v1/pipeline_run/pipeline_stage_run.proto";

message PipelineRunTriggerReq {}
message PipelineRunRetryReq {}
message PipelineRunCancelReq {}

message PipelineRunVersionBindingResp {
  string application_id = 1;
  string application_name = 2;
  string source_version_id = 3;
  string source_version_label = 4;
  optional string generated_version_id = 5;
  optional string generated_version_label = 6;
}

message PipelineRunResp {
  string id = 1;
  optional string project_id = 2;
  string repository_id = 3;
  string repository_name = 4;
  string snapshot_id = 5;
  string pipeline_id = 6;
  string pipeline_name = 7;
  int32 pipeline_version = 8;
  string trigger = 9;
  string repository_ref = 10;
  repeated orbit.v1.common.VariableDeclarationResp variables_snapshot = 11;
  string status = 12;
  optional string retry_of = 13;
  optional string started_at = 14;
  optional string finished_at = 15;
  optional string error_message = 16;
  string created_at = 17;
  repeated PipelineStageRunResp pipeline_stage_runs = 18;
  optional PipelineRunVersionBindingResp version_binding = 19;
}

message PipelineRunArtifactListResp { repeated ArtifactResp items = 1; }
message PipelineStageLogResp { string logs = 1; int32 offset = 2; bool is_complete = 3; }
message PipelineRunPaginatedResp { repeated PipelineRunResp items = 1; int32 total = 2; int32 page = 3; int32 per_page = 4; int32 pages = 5; }
message PipelineRunExecuteTaskReq {}
