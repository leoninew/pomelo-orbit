syntax = "proto3";

package orbit.v1.route;


message RouteResp {
  string id = 1;
  string name = 2;
  string domain = 3;
  string path_prefix = 4;
  string target_url = 5;
  bool enabled = 6;
  bool https_enabled = 7;
  string cert_type = 8;
  string created_at = 9;
  string updated_at = 10;
  string protocol = 11;
  optional int32 listen_port = 12;
  optional string service_id = 13;
  optional string component_name = 14;
  optional string endpoint_protocol = 15;
  optional int32 endpoint_container_port = 16;
  string acme_challenge = 17;
  string gateway_application_id = 18;
  bool http01_available = 19;
  bool dns01_available = 20;
  string acme_challenge_hint = 21;
}

message RouteCreateReq {
  string name = 1;
  string domain = 2;
  string path_prefix = 3;
  string target_url = 4;
  bool enabled = 5;
  string protocol = 6;
  optional int32 listen_port = 7;
  optional string service_id = 8;
  optional string component_name = 9;
  optional string endpoint_protocol = 10;
  optional int32 endpoint_container_port = 11;
}

message RouteUpdateReq {
  optional string name = 1;
  optional string domain = 2;
  optional string path_prefix = 3;
  optional string target_url = 4;
  optional bool enabled = 5;
  optional string protocol = 6;
  optional int32 listen_port = 7;
  optional string service_id = 8;
  optional string component_name = 9;
  optional string endpoint_protocol = 10;
  optional int32 endpoint_container_port = 11;
}

message RouteEnableReq {}

message RouteDisableReq {}

message RouteSyncChange {
  string route_id = 1;
  bool enabled = 2;
}

message RouteSyncPreviewReq {
  repeated RouteSyncChange changes = 1;
}

message RouteSyncDiffResp {
  string action = 1;
  string route_name = 2;
  string field = 3;
  string business_value = 4;
  string traefik_value = 5;
}

message RouteSyncPreviewResp {
  string business_hash = 1;
  string traefik_hash = 2;
  bool matched = 3;
  repeated RouteSyncDiffResp differences = 4;
}

message RouteSyncConfirmReq {
  repeated RouteSyncChange changes = 1;
  string business_hash = 2;
  string traefik_hash = 3;
}

message RouteLetsEncryptEnableReq {
  string challenge = 1;
}

message RouteMkcertEnableReq {}

message RouteEnableResp {
  string message = 1;
}

message RouteDisableResp {
  string message = 1;
}

message RouteSyncConfirmResp {
  string message = 1;
}

message RoutePaginatedResp {
  repeated RouteResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
