syntax = "proto3";

package orbit.v1.route;


message RouteResp {
  string id = 1;
  string name = 2;
  string domain = 3;
  string path_prefix = 4;
  string target_url = 5;
  bool enabled = 6;
  bool https_enabled = 7;
  string cert_type = 8;
  string created_at = 9;
  string updated_at = 10;
  string protocol = 11;
  optional int32 listen_port = 12;
  optional string service_id = 13;
  optional string component_name = 14;
  optional string endpoint_protocol = 15;
  optional int32 endpoint_container_port = 16;
  string acme_challenge = 17;
  string gateway_application_id = 18;
  bool http01_available = 19;
  bool dns01_available = 20;
  string acme_challenge_hint = 21;
}

message RouteCreateReq {
  string name = 1;
  string domain = 2;
  string path_prefix = 3;
  string target_url = 4;
  bool enabled = 5;
  string protocol = 6;
  optional int32 listen_port = 7;
  optional string service_id = 8;
  optional string component_name = 9;
  optional string endpoint_protocol = 10;
  optional int32 endpoint_container_port = 11;
}

message RouteUpdateReq {
  optional string name = 1;
  optional string domain = 2;
  optional string path_prefix = 3;
  optional string target_url = 4;
  optional bool enabled = 5;
  optional string protocol = 6;
  optional int32 listen_port = 7;
  optional string service_id = 8;
  optional string component_name = 9;
  optional string endpoint_protocol = 10;
  optional int32 endpoint_container_port = 11;
}

message RouteEnableReq {}

message RouteDisableReq {}

message RouteSyncChange {
  string route_id = 1;
  optional bool enabled = 2;
}

message RouteSyncPreviewReq {
  repeated RouteSyncChange changes = 1;
  string scope = 2;
  repeated string route_ids = 3;
}

message RouteSyncPlanItemResp {
  string route_id = 1;
  string route_name = 2;
  string action = 3;
  RouteSyncRuleResp rule = 4;
  string cert_type = 5;
  string acme_challenge = 6;
  string business_hash = 7;
  string publication_hash = 8;
}

message RouteSyncRuleResp {
  string match = 1;
  string target = 2;
  string protocol = 3;
}

message RouteSyncPreviewResp {
  string business_hash = 1;
  reserved 2, 3;
  repeated RouteSyncPlanItemResp items = 4;
  repeated string route_ids = 5;
  string publication_hash = 6;
}

message RouteSyncConfirmReq {
  repeated RouteSyncChange changes = 1;
  string business_hash = 2;
  reserved 3;
  repeated string route_ids = 4;
  string publication_hash = 5;
}

message RouteLetsEncryptEnableReq {
  string challenge = 1;
}

message RouteMkcertEnableReq {}

message RouteEnableResp {
  string message = 1;
}

message RouteDisableResp {
  string message = 1;
}

message RouteSyncConfirmResp {
  string message = 1;
  string code = 2;
  repeated RouteSyncResultResp results = 3;
  string request_id = 4;
}

message RouteSyncResultResp {
  string route_id = 1;
  string route_name = 2;
  string operation_id = 3;
  string code = 4;
  string error = 5;
  string business_save = 6;
  string file_commit = 7;
  string configuration_match = 8;
  string certificate_verification = 9;
  string recovery = 10;
  string cleanup = 11;
}

message RoutePaginatedResp {
  repeated RouteResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
