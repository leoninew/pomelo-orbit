syntax = "proto3";

package orbit.v1.service;

message ServiceResp {
  reserved 5, 13;

  string id = 1;
  string application_id = 2;
  string instance_key = 3;
  string version_id = 4;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
  // Display labels (filled on project-scoped list; empty on bare app-scoped list).
  string application_name = 9;
  string application_code = 10;
  string application_kind = 11;
  string version_label = 12;
  repeated ServiceExposeResp exposes = 14;
  map<string, string> runtime_config = 15;
}

message ServiceListResp {
  repeated ServiceResp items = 1;
}

message ServicePaginatedResp {
  repeated ServiceResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}

message ServiceCreateReq {
  string application_id = 1;
  string version_id = 2;
  string instance_key = 3;
  map<string, string> runtime_config = 4;
  repeated ServiceExposeReq exposes = 5;
}

message ServiceConfigReq {
  reserved 1;
  map<string, string> runtime_config = 2;
  repeated ServiceExposeReq exposes = 3;
}

message ServiceBasicUpdateReq {
  string version_id = 1;
  string instance_key = 2;
}

message ServiceExposeReq {
  string component_name = 1;
  string protocol = 2;
  int32 container_port = 3;
  optional string path_prefix = 4;
  string access = 5;
  optional int32 listen_port = 6;
}

message ServiceExposeResp {
  string id = 1;
  string service_id = 2;
  string component_name = 3;
  string protocol = 4;
  int32 container_port = 5;
  optional string path_prefix = 6;
  string access = 7;
  optional int32 listen_port = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ServicePreviewReq {}

message ServicePreviewResp {
  string compose_yaml = 1;
}

message ServiceDeployReq {
  bool force_recreate = 1;
}

message ServiceDeployResp {
  string deployment_id = 1;
  repeated string warnings = 2;
}

message ServiceStopReq {
  bool remove_volumes = 1;
}

message ServiceRestartReq {}
