syntax = "proto3";

package orbit.v1;

message VersionComponentReq {
  string name = 1;
  string image = 2;
  optional string command_json = 3;
  optional string args_json = 4;
  optional string env_json = 5;
  optional string ports_json = 6;
  optional string mounts_json = 7;
  optional string networks_json = 8;
  optional string depends_on_json = 9;
  optional string healthcheck_json = 10;
  optional string resources_json = 11;
  optional string pull_policy = 12;
}

message VersionComponentResp {
  string id = 1;
  string version_id = 2;
  string name = 3;
  string image = 4;
  optional string command_json = 5;
  optional string args_json = 6;
  optional string env_json = 7;
  optional string ports_json = 8;
  optional string mounts_json = 9;
  optional string networks_json = 10;
  optional string depends_on_json = 11;
  optional string healthcheck_json = 12;
  optional string resources_json = 13;
  optional string pull_policy = 14;
  string created_at = 15;
  string updated_at = 16;
}

message VersionExposeReq {
  string component_name = 1;
  string protocol = 2;
  int32 container_port = 3;
  optional string path_prefix = 4;
  // local | public; empty treated as public
  string access = 5;
  // 0/omit = use container_port
  optional int32 listen_port = 6;
}

message VersionExposeResp {
  string id = 1;
  string version_id = 2;
  string component_name = 3;
  string protocol = 4;
  int32 container_port = 5;
  optional string path_prefix = 6;
  string created_at = 7;
  string updated_at = 8;
  string access = 9;
  optional int32 listen_port = 10;
}

message VersionCreateReq {
  string application_id = 1;
  string label = 2;
  optional string env_json = 3;
  optional string note = 4;
  repeated VersionComponentReq components = 5;
  repeated VersionExposeReq exposes = 6;
}

message VersionUpdateReq {
  optional string label = 1;
  optional string env_json = 2;
  optional string note = 3;
  repeated VersionComponentReq components = 4;
  repeated VersionExposeReq exposes = 5;
}

message VersionForkReq {
  string label = 1;
}

message VersionResp {
  string id = 1;
  string application_id = 2;
  string label = 3;
  string status = 4;
  optional string env_json = 5;
  optional string created_from_version_id = 6;
  optional string note = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated VersionComponentResp components = 10;
  repeated VersionExposeResp exposes = 11;
}

message VersionPaginatedResp {
  repeated VersionResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}

message VersionPreviewReq {
  string environment_id = 1;
  optional string instance_key = 2;
}

message VersionPreviewResp {
  string compose_yaml = 1;
}

message ServiceResp {
  string id = 1;
  string application_id = 2;
  string environment_id = 3;
  string instance_key = 4;
  string version_id = 5;
  optional string last_successful_version_id = 6;
  string status = 7;
  string created_at = 8;
  string updated_at = 9;
  // Display labels (filled on project-scoped list; empty on bare app-scoped list).
  string application_name = 10;
  string application_code = 11;
  string application_kind = 12;
  string environment_name = 13;
  string environment_code = 14;
  string version_label = 15;
  optional string last_successful_version_label = 16;
}

message ServiceListResp {
  repeated ServiceResp items = 1;
}

message ServicePaginatedResp {
  repeated ServiceResp items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 pages = 5;
}
