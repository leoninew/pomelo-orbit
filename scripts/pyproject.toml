[project]
name = "pomelo-orbit-scripts"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "cryptography",
  "ulid-py>=1.1.0,<2",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["cert.py", "database_transfer.py", "gen_ulid.py", "manage.py", "version-calc.py"]

[[tool.mypy.overrides]]
module = ["ulid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
