[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[project]
name = "pomelo-orbit-cli"
version = "0.0.0"
description = "Pomelo Orbit operational CLI tools."
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "cryptography>=44,<46",
  "dynaconf>=3.3,<4",
  "pomelo-dbtalk>=0.28.0,<0.29",
  "python-dotenv>=1.0,<2",
  "ulid-py>=1.1.0,<2",
]

[project.scripts]
pomelo-orbit-cli = "pomelo_orbit_cli.cli:main"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src", "tests", "cert.py", "gen_ulid.py", "manage.py", "version-calc.py"]

[[tool.mypy.overrides]]
module = ["dynaconf", "ulid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
