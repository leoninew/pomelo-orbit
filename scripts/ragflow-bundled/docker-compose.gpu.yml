# GPU overlay for the bundled RAGFlow + TEI Compose reference.
# Use only on a host with NVIDIA Driver and NVIDIA Container Toolkit. Preview with:
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml config
# Orbit lifecycle operations remain MCP-only.
services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9.3@sha256:249a0bc87522bfe2f1012b4d194f0225878f47079115ada3aeb0b1ef257b402a
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
