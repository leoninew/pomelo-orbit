# Generated by scripts/render_ragflow_deployment_contract.py from scripts/ragflow-split/deployment-contract.json.
# Do not edit this file directly.
# Alternate split deployment mode: deploy only when five independent Applications are requested.
# TEI is part of the RAGFlow Application rather than a sixth independent Application.
# Do not combine with scripts/ragflow-bundled/docker-compose.yml.
services:
  es01:
    image: "elasticsearch:8.11.3"
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}"
      node.name: es01
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - "elasticsearch_data:/usr/share/elasticsearch/data"
    tmpfs:
      - "/tmp:size=536870912,mode=1777"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 8g
    networks:
      traefik:
        aliases:
          - ragflow-elasticsearch-es01
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" http://localhost:9200"
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
volumes:
  elasticsearch_data: {}
networks:
  traefik:
    external: true
