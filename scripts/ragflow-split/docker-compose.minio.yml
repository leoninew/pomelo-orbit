services:
  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: [server, --console-address, ":9001", /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
    volumes:
      - minio_data:/data
    networks:
      traefik:
        aliases:
          - ragflow-minio-minio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

volumes:
  minio_data:

networks:
  traefik:
    external: true
