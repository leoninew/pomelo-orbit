# Generated by skills/deploy-ragflow-integrated-orbit/render_contract.py from skills/deploy-ragflow-integrated-orbit/deployment-contract.json.
# Do not edit this file directly.
# CPU reference for the default Orbit deployment mode: one RAGFlow Application with six Components.
# Do not use this file when the user explicitly requests split applications.
# Each bundled component owns a separate directory directly below the Service workspace.
# Combine with docker-compose.gpu.yml to reproduce the GPU TEI variant on an NVIDIA-capable host.
services:
  mysql:
    image: "mysql:8.0.39"
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - "--tls_version=TLSv1.2,TLSv1.3"
      - --binlog_expire_logs_seconds=604800
    environment:
      MYSQL_DATABASE: rag_flow
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"
    volumes:
      - "./mysql:/var/lib/mysql"
    networks:
      traefik:
        aliases:
          - ragflow-mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
  redis:
    image: "valkey/valkey:8"
    command:
      - sh
      - -c
      - "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 128mb --maxmemory-policy allkeys-lru"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - "./redis:/data"
    networks:
      traefik:
        aliases:
          - ragflow-redis
    healthcheck:
      test:
        - CMD-SHELL
        - "redis-cli -a \"$${REDIS_PASSWORD}\" ping"
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
  minio:
    image: "pgsty/minio:RELEASE.2026-03-25T00-00-00Z"
    command:
      - server
      - --console-address
      - ":9001"
      - /data
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:?MINIO_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?MINIO_PASSWORD must be set}"
    volumes:
      - "./minio:/data"
    networks:
      traefik:
        aliases:
          - ragflow-minio
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - "http://localhost:9000/minio/health/live"
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
  es01:
    image: "elasticsearch:8.11.3"
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}"
      node.name: es01
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - "./es01:/usr/share/elasticsearch/data"
    tmpfs:
      - "/tmp:size=536870912,mode=1777"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 8g
    networks:
      traefik:
        aliases:
          - ragflow-es01
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" http://localhost:9200"
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
  tei:
    image: "ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07"
    command:
      - --model-id
      - /data/bge-m3
      - --json-output
    volumes:
      - "./tei/cache:/data"
    networks:
      traefik:
        aliases:
          - ragflow-tei
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:80/health"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5m
    restart: unless-stopped
  ragflow-cpu:
    image: "infiniflow/ragflow:v0.26.4"
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    environment:
      DOC_ENGINE: elasticsearch
      DEVICE: cpu
      API_PROXY_SCHEME: python
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DBNAME: rag_flow
      MYSQL_USER: root
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"
      MYSQL_MAX_PACKET: "1073741824"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      MINIO_HOST: minio
      MINIO_USER: "${MINIO_USER:?MINIO_USER must be set}"
      MINIO_PASSWORD: "${MINIO_PASSWORD:?MINIO_PASSWORD must be set}"
      ES_HOST: es01
      ES_USER: elastic
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      es01:
        condition: service_healthy
      tei:
        condition: service_healthy
    volumes:
      - "./ragflow/logs:/ragflow/logs"
    networks:
      traefik:
        aliases:
          - ragflow-ragflow-cpu
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - "http://localhost:80/"
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
networks:
  traefik:
    external: true
