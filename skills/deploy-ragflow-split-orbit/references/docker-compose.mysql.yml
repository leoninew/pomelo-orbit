# Generated by skills/deploy-ragflow-split-orbit/render_contract.py from skills/deploy-ragflow-split-orbit/deployment-contract.json.
# Do not edit this file directly.
# Alternate split deployment mode: deploy only when five independent Applications are requested.
# TEI is part of the RAGFlow Application rather than a sixth independent Application.
# Do not combine with the integrated RAGFlow Compose reference.
services:
  mysql:
    image: "mysql:8.0.39"
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - "--tls_version=TLSv1.2,TLSv1.3"
      - --binlog_expire_logs_seconds=604800
    environment:
      MYSQL_DATABASE: rag_flow
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"
    volumes:
      - "mysql_data:/var/lib/mysql"
    networks:
      traefik:
        aliases:
          - ragflow-mysql-mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
volumes:
  mysql_data: {}
networks:
  traefik:
    external: true
