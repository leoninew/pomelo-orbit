# Reference only: use pomelo-orbit-mcp for normal lifecycle operations.
# This shows the equivalent Sub2API topology for review or an explicitly
# authorized fallback. Orbit materializes the three relative mount sources
# beneath the Service workspace and supplies the runtime values itself.
services:
  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    pull_policy: always
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: sub2api
      TZ: Asia/Shanghai
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      default: {}
      traefik:
        aliases:
          - sub2api-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    pull_policy: always
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      TZ: Asia/Shanghai
    volumes:
      - ./redis:/data
    networks:
      default: {}
      traefik:
        aliases:
          - sub2api-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    image: weishaw/sub2api:latest
    container_name: sub2api-app
    pull_policy: always
    restart: unless-stopped
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      ADMIN_EMAIL: admin@sub2api.local
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      JWT_EXPIRE_HOUR: "24"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set}"
      TZ: Asia/Shanghai
    volumes:
      - ./app:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      traefik:
        aliases:
          - sub2api-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Intentionally no ports: declarations. The managed HTTP Route targets
# sub2api-app:8080 over the external Traefik network.
networks:
  traefik:
    external: true
