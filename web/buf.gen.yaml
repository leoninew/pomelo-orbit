version: v2
clean: true
plugins:
  - remote: buf.build/community/stephenh-ts-proto:v2.11.8
    out: src/gen/proto
    opt:
      - onlyTypes=true
      - outputEncodeMethods=false
      - outputJsonMethods=false
      - outputClientImpl=false
      - snakeToCamel=false
      - useDate=string
      - esModuleInterop=true
      - forceLong=number
